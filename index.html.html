<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Biography QR Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a8b, #ff6a88, #d4a5a5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      width: 450px;
    }
    h2 {
      text-align: center;
      color: #444;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #ff6a88;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #e85c75;
    }
    #bioCard {
      margin-top: 20px;
      text-align: center;
    }
    #bioCard .card {
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
      display:inline-block;
      width:100%;
    }
    #bioCard img {
      max-width:150px;
      border-radius:8px;
      margin:10px;
    }
    #qrCode {
      text-align: center;
      margin-top: 20px;
    }
    a { color:#ff6a88; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <div id="loginForm">
      <h2>Login</h2>
      <input type="text" id="loginUser" placeholder="Username">
      <input type="password" id="loginPass" placeholder="Password">
      <button onclick="login()">Login</button>
      <p style="text-align:center;">No account? <a href="#" onclick="showSignup()">Sign up</a></p>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display:none;">
      <h2>Sign Up</h2>
      <input type="text" id="signupUser" placeholder="Choose Username">
      <input type="password" id="signupPass" placeholder="Choose Password">
      <button onclick="signup()">Register</button>
      <p style="text-align:center;"><a href="#" onclick="showLogin()">Back to Login</a></p>
    </div>

    <!-- Biography Form -->
    <div id="bioForm" style="display:none;">
      <h2>Biography</h2>
      <input type="text" id="name" placeholder="Full Name">
      <input type="text" id="address" placeholder="Address">
      <input type="text" id="phone" placeholder="User Phone Number">
      <input type="text" id="guardianName" placeholder="Guardian/Emergency Contact Name">
      <input type="text" id="guardianPhone" placeholder="Guardian Contact Number">
      <input type="text" id="facebook" placeholder="Facebook Profile Link">
      <input type="text" id="instagram" placeholder="Instagram Username">
      <input type="file" id="photo" accept="image/*" onchange="previewPhoto()">
      <img id="photoPreview" style="display:none;">
      <button onclick="saveBio()">Save Biography</button>
      <div id="bioCard"></div>
      <div id="qrCode"></div>
    </div>
  </div>

  <!-- QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script>
    let currentUser = null;

    function showSignup() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("signupForm").style.display = "block";
    }

    function showLogin() {
      document.getElementById("signupForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    }

    function signup() {
      const user = document.getElementById("signupUser").value.trim();
      const pass = document.getElementById("signupPass").value.trim();

      if (!user || !pass) {
        alert("Please fill in all fields.");
        return;
      }

      if (localStorage.getItem(user)) {
        alert("Username already exists!");
        return;
      }

      localStorage.setItem(user, JSON.stringify({password: pass, bio: null}));
      alert("Account created successfully! You can now log in.");
      showLogin();
    }

    function login() {
      const user = document.getElementById("loginUser").value.trim();
      const pass = document.getElementById("loginPass").value.trim();

      const account = localStorage.getItem(user);
      if (!account) {
        alert("This username is not registered yet. Please sign up first.");
        showSignup();
        return;
      }

      const data = JSON.parse(account);
      if (data.password !== pass) {
        alert("Incorrect password!");
        return;
      }

      currentUser = user;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("bioForm").style.display = "block";

      if (data.bio) {
        document.getElementById("name").value = data.bio.name;
        document.getElementById("address").value = data.bio.address;
        document.getElementById("phone").value = data.bio.phone;
        document.getElementById("guardianName").value = data.bio.guardianName;
        document.getElementById("guardianPhone").value = data.bio.guardianPhone;
        document.getElementById("facebook").value = data.bio.facebook;
        document.getElementById("instagram").value = data.bio.instagram;
        if (data.bio.photo) {
          document.getElementById("photoPreview").src = data.bio.photo;
          document.getElementById("photoPreview").style.display = "block";
        }
        // Automatically show biography card and QR code
        displayBio(data.bio);
        generateQR(data.bio);
      }
    }

    function previewPhoto() {
      const file = document.getElementById("photo").files[0];
      const preview = document.getElementById("photoPreview");
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    function saveBio() {
      const bioData = {
        name: document.getElementById("name").value,
        address: document.getElementById("address").value,
        phone: document.getElementById("phone").value,
        guardianName: document.getElementById("guardianName").value,
        guardianPhone: document.getElementById("guardianPhone").value,
        facebook: document.getElementById("facebook").value,
        instagram: document.getElementById("instagram").value,
        photo: document.getElementById("photoPreview").src
      };

      localStorage.setItem(currentUser, JSON.stringify({password: JSON.parse(localStorage.getItem(currentUser)).password, bio: bioData}));
      displayBio(bioData);
      generateQR(bioData);
    }

    function displayBio(bio) {
      document.getElementById("bioCard").innerHTML = `
        <div class="card">
          <h2>${bio.name}</h2>
          ${bio.photo ? `<img src="${bio.photo}">` : ""}
          <p><strong>Address:</strong> ${bio.address}</p>
          <p><strong>User Phone:</strong> ${bio.phone}</p>
          <p><strong>Guardian:</strong> ${bio.guardianName} (${bio.guardianPhone})</p>
          <p><strong>Facebook:</strong> <a href="${bio.facebook}" target="_blank">${bio.facebook}</a></p>
          <p><strong>Instagram:</strong> <a href="https://instagram.com/${bio.instagram}" target="_blank">@${bio.instagram}</a></p>
        </div>
      `;
    }

    function generateQR(bio) {}
      const bioPage = `
        <html>
          <head>
            <title>${bio.name}'s Biography</title>
            <style>
              body { font-family: Arial; background:#f9f9f9; text-align:center; padding:20px; }
              img { max-width:150px; border-radius:8
